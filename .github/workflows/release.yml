name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stable-release
  queue: max

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && github.repository == 'y2-intel/harness'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Compute release from Y2 history
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py plan --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-plan.json" --github-output "$GITHUB_OUTPUT"

      - name: Retain immutable release plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan.json
          overwrite: true

  verify:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    uses: ./.github/workflows/full-ci.yml
    with:
      app_version: ${{ needs.plan.outputs.version }}

  build-linux:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dapp-version=${{ needs.plan.outputs.version }}

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/y2-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/y2 LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf y2-${{ matrix.name }}.tar.gz -C "$package_dir" y2 LICENSE THIRD_PARTY_NOTICES.md
          sha256sum y2-${{ matrix.name }}.tar.gz > y2-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: y2-${{ matrix.name }}
          path: |
            y2-${{ matrix.name }}.tar.gz
            y2-${{ matrix.name }}.tar.gz.sha256

  build-macos-x86_64:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    name: Build macos-x86_64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos -Dapp-version=${{ needs.plan.outputs.version }}

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/y2-package-macos-x86_64"
          mkdir -p "$package_dir"
          cp zig-out/bin/y2 LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf y2-macos-x86_64.tar.gz -C "$package_dir" y2 LICENSE THIRD_PARTY_NOTICES.md
          shasum -a 256 y2-macos-x86_64.tar.gz > y2-macos-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: y2-macos-x86_64
          path: |
            y2-macos-x86_64.tar.gz
            y2-macos-x86_64.tar.gz.sha256

  build-macos-arm64:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-macos-arm64.yml
    with:
      package_release: true
      app_version: ${{ needs.plan.outputs.version }}

  release:
    needs: [plan, verify, build-linux, build-macos-x86_64, build-macos-arm64]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download release plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan

      - name: Download archives and checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: y2-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Generate reviewed product notes
        run: |
          python3 scripts/release_notes.py \
            --plan "$RUNNER_TEMP/release-plan/release-plan.json" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Publish verified release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_release.py \
            --plan "$RUNNER_TEMP/release-plan/release-plan.json" \
            --assets "$RUNNER_TEMP/release-assets" \
            --notes "$RUNNER_TEMP/release-notes.md"
